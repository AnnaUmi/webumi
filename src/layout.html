<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <link rel="canonical" href="{{url}}">
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1">
  <meta name="author" content="Webumi">
  <meta name="geo.region" content="AU">

  <!-- Social sharing (Facebook, LinkedIn, WhatsApp, iMessage, X) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Webumi">
  <meta property="og:locale" content="en_AU">
  <meta property="og:url" content="{{url}}">
  <meta property="og:title" content="{{ogTitle}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:image" content="{{site}}/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Webumi bear logo — More customers. Less admin.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ogTitle}}">
  <meta name="twitter:description" content="{{description}}">
  <meta name="twitter:image" content="{{site}}/og-image.png">

  <meta name="theme-color" content="#0f2a3d">
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="alternate" type="text/plain" href="/llms.txt" title="Webumi summary for AI assistants">
  <link rel="preload" href="/fonts/bricolage-grotesque-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{v:styles.css}}">
  <link rel="stylesheet" href="{{v:bears.css}}">
  <link rel="stylesheet" href="{{v:hero-demo.css}}">
  <style>
    /* sale prices: build.js "deal" tokens and partials/sale.html */
    .deal { font: inherit; }
    .deal__was { font-size: .55em; font-weight: 600; opacity: .55; text-decoration-thickness: 2px; margin-right: .15em; vertical-align: .2em; }
    .sale { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin: 0 0 28px; padding: 14px 18px; background: var(--sun, #ffd23f); color: #111; border: 3px solid #111; border-radius: 16px; box-shadow: 5px 5px 0 #111; font-weight: 500; line-height: 1.45; }
    .sale__tag { display: inline-block; padding: 4px 10px; background: #111; color: var(--sun, #ffd23f); border-radius: 999px; font-size: .8rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
    .pbox .sale__tag { margin-bottom: 10px; }
    .sale .deal { font-weight: 800; }
    .sale .deal__was { font-size: .85em; vertical-align: 0; }
  </style>

  <script type="application/ld+json">
{{schema}}
  </script>
</head>
<body>
  {{> icons}}
  {{> salebar}}
  {{> header}}

  <main id="top">
{{content}}
{{> contact}}
  </main>

  {{> footer}}

  <!-- Mobile sticky CTA -->
  <a href="/order/" class="sticky-cta" id="stickyCta">Get a fixed quote →</a>

  <script src="{{v:offer.js}}"></script>
  <script src="{{v:script.js}}"></script>
{{> bear-list}}  <script src="{{v:bears.js}}" defer></script>
  <script src="{{v:hero-demo.js}}" defer></script>
</body>
</html>
