<svg xmlns="http://www.w3.org/2000/svg" viewBox="11 10 184 184" fill="none" stroke-linecap="round" stroke-linejoin="round"><style>
    .star { transform-box: view-box; transform-origin: 150px 133px; animation: twinkle 4s cubic-bezier(.34,1.56,.64,1) 1s infinite; }
    @keyframes twinkle {
      0%, 15%, 34%, 100% { transform: none; }
      19% { transform: scale(1.35) rotate(-25deg); }
      25% { transform: scale(.88) rotate(10deg); }
      30% { transform: scale(1.05); }
    }
    .spark { transform-box: fill-box; transform-origin: center; opacity: 0; animation: spark 4s ease-out 1s infinite; }
    .s2 { animation-delay: 1.1s; } .s3 { animation-delay: 1.2s; }
    @keyframes spark {
      0%, 17% { opacity: 0; transform: scale(.2); }
      22% { opacity: 1; transform: scale(1); }
      32%, 100% { opacity: 0; transform: scale(.4); }
    }
    @media (prefers-reduced-motion: reduce) { .star, .spark { animation: none; } }
