<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="MyTalisman — turn your goal into a sign">
  <defs>
    <radialGradient id="bg" cx="50%" cy="-10%" r="95%">
      <stop offset="0%" stop-color="#1B2358"/>
      <stop offset="55%" stop-color="#0A0F2E"/>
      <stop offset="100%" stop-color="#0A0F2E"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F5C451" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#F0399A" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#F0399A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFE2A6"/>
      <stop offset="0.45" stop-color="#F5C451"/>
      <stop offset="1" stop-color="#F0399A"/>
    </linearGradient>
    <!-- The Watcher geometry, struck once per print pass -->
    <g id="og-watcher" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M322 215L416 384L96 384L256 96L300 175" stroke-width="17"/>
      <circle cx="352" cy="110" r="9" fill="currentColor" stroke="none"/>
      <path d="M160 288Q256 212 352 288Q256 364 160 288Z" stroke-width="14"/>
      <circle cx="256" cy="288" r="33" stroke-width="10"/>
      <g stroke-width="9">
        <line x1="198.4" y1="263.6" x2="190.7" y2="247.4"/>
        <line x1="227.2" y1="253.5" x2="220.7" y2="226.3"/>
        <line x1="256" y1="250" x2="256" y2="218"/>
        <line x1="284.8" y1="253.5" x2="291.3" y2="226.3"/>
        <line x1="313.6" y1="263.6" x2="321.3" y2="247.4"/>
      </g>
    </g>
    <!-- Corner rosette: a diamond inside a diamond with a pip at the centre -->
    <path id="og-rosette" fill-rule="evenodd"
      d="M0 -13L13 0L0 13L-13 0Z M0 -6.5L6.5 0L0 6.5L-6.5 0Z M0 -2.2L2.2 0L0 2.2L-2.2 0Z"/>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- The plate: keylines and rosettes, rose ghost out of register under gilt -->
  <g opacity="0.45" fill="#F0399A" transform="translate(3,-3)">
    <rect x="14" y="14" width="1172" height="602" rx="34" fill="none" stroke="#F0399A" stroke-width="2" stroke-opacity="0.7"/>
    <rect x="30" y="30" width="1140" height="570" rx="24" fill="none" stroke="#F0399A" stroke-width="1" stroke-opacity="0.45"/>
    <use href="#og-rosette" x="44" y="44"/>
    <use href="#og-rosette" x="1156" y="44"/>
    <use href="#og-rosette" x="44" y="586"/>
    <use href="#og-rosette" x="1156" y="586"/>
  </g>
  <g opacity="0.9" fill="#F5C451">
    <rect x="14" y="14" width="1172" height="602" rx="34" fill="none" stroke="#F5C451" stroke-width="2" stroke-opacity="0.7"/>
    <rect x="30" y="30" width="1140" height="570" rx="24" fill="none" stroke="#F5C451" stroke-width="1" stroke-opacity="0.45"/>
    <use href="#og-rosette" x="44" y="44"/>
    <use href="#og-rosette" x="1156" y="44"/>
    <use href="#og-rosette" x="44" y="586"/>
    <use href="#og-rosette" x="1156" y="586"/>
  </g>

  <!-- Rolling cloud bank along the bottom edge -->
  <path d="M20 616 L20 588 Q75 552 140 588 Q190 562 265 588 Q330 546 420 588 Q475 566 545 588 Q615 550 700 588 Q755 564 825 588 Q895 548 980 588 Q1035 566 1105 588 Q1145 572 1180 588 L1180 616 Z"
    fill="#F5C451" fill-opacity="0.05" stroke="#F5C451" stroke-opacity="0.3" stroke-width="1.6" stroke-linejoin="round"/>

  <!-- The Watcher on the right, three print passes -->
  <g transform="translate(720, 125) scale(0.68)">
    <circle cx="256" cy="256" r="330" fill="url(#halo)"/>
    <g color="#FFBE55" stroke="#FFBE55" opacity="0.6" transform="translate(-5,3)"><use href="#og-watcher"/></g>
    <g color="#FF4FA8" stroke="#FF4FA8" opacity="0.5" transform="translate(5,-3)"><use href="#og-watcher"/></g>
    <g color="#FAF3E6" stroke="#FAF3E6"><use href="#og-watcher"/></g>
    <circle cx="256" cy="288" r="14" fill="#FAF3E6"/>
  </g>

  <!-- copy on the left -->
  <g transform="translate(90, 250)">
    <text x="0" y="0" fill="#F5C451" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="22" font-weight="600" letter-spacing="4">MYTALISMAN</text>
    <text x="0" y="64" fill="#F8F2E7" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="62" font-weight="800" letter-spacing="-2">Turn your goal</text>
    <text x="0" y="134" fill="url(#grad)" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="62" font-weight="800" letter-spacing="-2">into a sign.</text>
    <text x="0" y="196" fill="rgba(228,233,252,0.78)" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="25" font-weight="400">Name it, seal a vow, keep it in sight — one minute a day.</text>
  </g>
</svg>
